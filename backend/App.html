<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:15px Arial,sans-serif;background:#f3f6f1;color:#20352a;margin:0;padding:24px}.box{max-width:650px;margin:auto;background:white;padding:24px;border-radius:14px}h1{font-size:24px}label{display:block;margin:14px 0;font-weight:bold}input,select{width:100%;padding:12px;margin-top:6px;border:1px solid #ccd8ce;border-radius:7px;box-sizing:border-box}button{background:#1d5839;color:white;border:0;border-radius:7px;padding:13px 18px;font-weight:bold}small{color:#64746a}#msg{padding:12px;margin-top:14px;border-radius:8px;background:#edf4ed}</style></head><body><main class="box"><h1>Universo IF Avalia</h1><p>Área de avaliação do protótipo acadêmico. Cada código pode avaliar cada projeto uma única vez.</p><form id="f"><label>Código de avaliação<input id="codigo" required autocomplete="off"></label><label>Projeto<select id="projeto" required><option value="">Carregando catálogo…</option></select></label><div id="notas"></div><button>Enviar avaliação</button></form><p id="msg" role="status"></p><hr><h2>Ranking</h2><div id="ranking">Carregando…</div></main><script>
const labels=[['criatividade','Criatividade e inovação'],['clareza','Clareza da apresentação'],['relevancia','Relevância e impacto'],['demonstracao','Demonstração e resultados']];
function show(id,text){document.getElementById(id).textContent=text}
google.script.run.withSuccessHandler(list=>{const s=document.getElementById('projeto');s.innerHTML='<option value="">Selecione um projeto</option>'+list.map(p=>`<option value="${p.id}">${p.id} — ${p.titulo}</option>`).join('');}).withFailureHandler(e=>show('msg',e.message)).getProjectOptions();
document.getElementById('notas').innerHTML=labels.map(([k,l])=>`<label>${l}<select id="${k}" required><option value="">Selecione 1 a 5</option><option value="1">1 — Muito ruim</option><option value="2">2 — Ruim</option><option value="3">3 — Regular</option><option value="4">4 — Bom</option><option value="5">5 — Excelente</option></select></label>`).join('');
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();const payload={codigo:document.getElementById('codigo').value,projetoId:document.getElementById('projeto').value,notas:Object.fromEntries(labels.map(([k])=>[k,Number(document.getElementById(k).value)]))};show('msg','Enviando…');google.script.run.withSuccessHandler(r=>{show('msg',r.ok?'Avaliação confirmada. Recibo: '+r.receipt:r.message);loadRanking();}).withFailureHandler(err=>show('msg',err.message)).submitVoteInternal(payload);});
function loadRanking(){google.script.run.withSuccessHandler(r=>{document.getElementById('ranking').innerHTML=r.ranking.length?r.ranking.map(x=>`<p><b>${x.id_projeto} · ${x.titulo}</b><br>${x.media.toFixed(2)} / 5 · ${x.quantidade} avaliações</p>`).join(''):'Ainda não há projetos com cinco avaliações.';}).getPublicRanking();}loadRanking();
</script></body></html>
